name: Publish to WinGet

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to publish, for example 0.3.1
        required: true
        type: string

jobs:
  winget:
    runs-on: ubuntu-latest
    steps:
      # Sync the winget-pkgs fork with upstream first. A fork that has drifted far
      # behind makes komac's branch creation fail with a misleading
      # "does not have the correct permissions to execute CreateRef" error.
      - name: Sync winget-pkgs fork with upstream
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh api repos/fanis/winget-pkgs/merge-upstream -f branch=master
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Fanis.ClaudeCodeSwitcher
          installers-regex: 'claude-code-switcher\.exe$'
          release-tag: ${{ inputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}
